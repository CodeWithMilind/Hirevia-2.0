# # Hirevia - Telegram job-community monitoring
# # Separation of concerns:
# #   * Channel list lives HERE (no Python edits needed to add a community).
# #   * Credentials live in .env (TELEGRAM_API_ID / TELEGRAM_API_HASH / TELEGRAM_SESSION_NAME)
# #     and are NEVER stored in this file.
